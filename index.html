<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | POS Accounting System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="login-body">

  <div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="card login-card shadow">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="brand-badge mx-auto mb-3">POS</div>
          <h1 class="h4 fw-bold mb-1">POS Accounting System</h1>
          <p class="text-muted small mb-4">Sign in to your account</p>
        </div>

        <form id="loginForm" novalidate>
          <!-- Username -->
          <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" class="form-control" id="username" placeholder="Enter username" required>
            <div class="invalid-feedback" id="usernameError"></div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" placeholder="Enter password" required>
            <div class="invalid-feedback" id="passwordError"></div>
          </div>

          <!-- Role -->
          <div class="mb-4">
            <label for="role" class="form-label">Account Type</label>
            <select class="form-select" id="role" required>
              <option value="" selected disabled>Select role</option>
              <option value="admin">Admin</option>
              <option value="manager">Manager</option>
              <option value="cashier">Cashier</option>
            </select>
            <div class="invalid-feedback" id="roleError">Please select your account type.</div>
          </div>

          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-primary btn-lg">Sign In</button>
          </div>
          
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
